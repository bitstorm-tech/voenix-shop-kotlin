product: jvm/lib

apply:
  - ../../backend.module-template.yaml

plugins:
  detekt: enabled
  ktfmt: enabled
  ktlint: enabled

dependencies:
  - ../platform
  - ../email
  - $libs.ktor.server.auth
  - $libs.ktor.server.core
  - $libs.ktor.server.request.validation
  - $libs.ktor.server.sessions
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.exposed.java.time
  - $libs.slf4j.api

test-dependencies:
  - ../test-support
  # Test-only: the supplier admin routes are what answers the `409` when a
  # supplier still has logins (`SupplierLoginSupplierDeleteIntegrationTest`).
  # Production code of this module knows nothing about the supplier module.
  - ../supplier
  - $libs.ktor.server.test.host

settings:
  kotlin:
    serialization:
      format: json
      version: 1.11.0

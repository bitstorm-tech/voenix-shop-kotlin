product: jvm/lib

apply:
  - ../../backend.module-template.yaml

plugins:
  detekt: enabled
  ktfmt: enabled
  ktlint: enabled

dependencies:
  - ../platform
  - ../image: exported
  - ../article: exported
  - ../prompt: exported
  - ../promotion: exported
  # Reorder: the cart owns the route, the order module owns the ownership-checked lookup behind it.
  - ../order: exported
  - $libs.ktor.server.core
  - $libs.ktor.server.request.validation
  - $libs.exposed.core
  - $libs.exposed.jdbc
  - $libs.exposed.java.time
  - $libs.slf4j.api

test-dependencies:
  - ../test-support
  - $libs.ktor.server.sessions
  - $libs.ktor.server.test.host

settings:
  kotlin:
    serialization:
      format: json
      version: 1.11.0

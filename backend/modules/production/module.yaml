product: jvm/lib

apply:
  - ../../backend.module-template.yaml

plugins:
  detekt: enabled
  ktfmt: enabled
  ktlint: enabled

dependencies:
  - ../platform
  - ../email
  # The fulfillment lists label an admin's rows with supplier names, through the
  # supplier module's batched reader.
  - ../supplier
  - $libs.ktor.server.auth
  - $libs.ktor.server.core
  # The print-on-demand channel talks HTTP itself: the SPOD client is hand-written for the same
  # reason the Mollie one is — an SDK would log wherever it pleases, and nothing this partner
  # writes may ever reach a log line.
  - $libs.ktor.client.core
  - $libs.ktor.client.cio
  - $libs.ktor.server.request.validation
  - $libs.exposed.core
  - $libs.exposed.java.time
  - $libs.exposed.jdbc
  - $libs.pdfbox
  - $libs.slf4j.api
  - $libs.sshd.core
  - $libs.sshd.sftp
  # ImageIO reader for the WebP originals the production PDF embeds; used via the ImageIO SPI.
  - $libs.webp.imageio: runtime-only

test-dependencies:
  - ../test-support
  # The SPOD client is driven against a MockEngine, which is how the exact request JSON, the
  # access-token header, and the pacer's timing are observable at all.
  - $libs.ktor.client.mock
  # The SLF4J binding of the tests: that no token and no provider body ever reaches a log line is
  # only observable in the log itself.
  - $libs.logback.classic
  - $libs.ktor.server.test.host

settings:
  kotlin:
    serialization:
      format: json
      version: 1.11.0

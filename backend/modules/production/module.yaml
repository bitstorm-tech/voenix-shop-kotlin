product: jvm/lib

apply:
  - ../../backend.module-template.yaml

plugins:
  detekt: enabled
  ktfmt: enabled
  ktlint: enabled

dependencies:
  - ../platform
  - ../email
  # The fulfillment lists label an admin's rows with supplier names, through the
  # supplier module's batched reader.
  - ../supplier
  # The print-on-demand channel's HTTP client, shared with the module that syncs the t-shirt
  # catalog from the same partner. Exported because `createProductionModule` takes the one client
  # instance an application paces all its SPOD calls through.
  - ../spod: exported
  - $libs.ktor.server.auth
  - $libs.ktor.server.core
  - $libs.ktor.server.request.validation
  - $libs.exposed.core
  - $libs.exposed.java.time
  - $libs.exposed.jdbc
  - $libs.pdfbox
  - $libs.slf4j.api
  - $libs.sshd.core
  - $libs.sshd.sftp
  # ImageIO reader for the WebP originals the production PDF embeds; used via the ImageIO SPI.
  - $libs.webp.imageio: runtime-only

test-dependencies:
  - ../test-support
  # The submission stage is driven against a MockEngine, so no test ever reaches the real partner.
  - $libs.ktor.client.mock
  - $libs.ktor.server.test.host

settings:
  kotlin:
    serialization:
      format: json
      version: 1.11.0

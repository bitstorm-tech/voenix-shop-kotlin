product: jvm/lib

apply:
  - ../../backend.module-template.yaml

plugins:
  detekt: enabled
  ktfmt: enabled
  ktlint: enabled

dependencies:
  - ../platform
  - $libs.ktor.server.auth
  - $libs.ktor.server.conditional.headers
  - $libs.ktor.server.core
  - $libs.ktor.server.partial.content
  - $libs.scrimage.core
  - $libs.slf4j.api
  - $libs.webp.imageio

test-dependencies:
  - $libs.ktor.server.test.host
  # The SLF4J binding of the tests: a failing example-image cleanup is only logged, so the log is
  # the only place that outcome is observable, and asserting it needs a real logger implementation.
  - $libs.logback.classic

product: jvm/lib

apply:
  - ../../backend.module-template.yaml

plugins:
  detekt: enabled
  ktfmt: enabled
  ktlint: enabled

dependencies:
  - ../platform
  - ../article: exported
  - ../prompt: exported
  - ../magic-coins: exported
  - $libs.ktor.server.core
  - $libs.ktor.client.cio
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.client.core
  - $libs.ktor.serialization.json
  - $libs.slf4j.api

test-dependencies:
  - $libs.ktor.client.mock
  - $libs.ktor.server.sessions
  - $libs.ktor.server.test.host

settings:
  kotlin:
    serialization:
      format: json
      version: 1.11.0

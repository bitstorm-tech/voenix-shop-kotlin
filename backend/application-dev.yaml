# Shared development overrides, checked into Git. The launcher layers the
# configuration files in this order, later files winning per individual key:
#
#   app/resources/application.yaml   base defaults (in the JAR)
#   application-dev.yaml             shared development values (this file)
#   application-local.yaml           optional per-developer values, ignored by Git
#
# This file is complete on its own: a fresh checkout or worktree starts without
# application-local.yaml. The secrets below are development-only values for
# the local database container and placeholders. They are safe to check in
# because no deployment ever loads this file. Real keys (a Mollie test key, a
# fal.ai or Sweego key) belong in application-local.yaml, never here.
#
# Every file lists every key so you can see at a glance which file sets what.
# A bare key with nothing after the colon is NOT set and falls through to the
# earlier files. Writing "" instead would override the value with an empty
# string — never do that.
# See docs/dev/getting-started/running-the-development-server.md.

ktor:
  deployment:
    port:
  application:
    modules:

database:
  host:
  port:
  database: voenix_kotlin
  username: voenix
  password: voenix
  searchPath:
  sslMode:
  maximumPoolSize:

auth:
  sessionSecret: development-only-session-secret-not-for-production

frontend:
  baseUrl: http://localhost:5173
  distPath:

email:
  enabled:
  pollIntervalMinutes:
  apiKey:
  fromEmail:
  fromName:

production:
  artifactRoot:
  spod:
    webhookSecret:
    alertEmail:

generator:
  # true = the generator answers with the uploaded image and never calls the
  # paid fal.ai API. For real generation, override dummyMode and apiKey in
  # application-local.yaml.
  dummyMode: true
  apiKey:

mollie:
  # Placeholders that pass the startup checks. Starting a payment fails at the
  # Mollie API; to test payments, set a real test_ key and an ngrok webhook
  # URL in application-local.yaml.
  apiKey: test_development-placeholder
  redirectUrl: http://localhost:5173/checkout
  webhookUrl: https://localhost/api/payments/webhook/development-webhook-secret
  webhookSecret: development-webhook-secret

rateLimit:
  trustForwardedFor:

image:
  publicRoot:
  privateRoot:
  cacheRoot:

product: jvm/app

apply:
  - ../backend.module-template.yaml

plugins:
  detekt:
    enabled: true
    includePluginSources: true
  ktfmt:
    enabled: true
    includePluginSources: true
  ktlint:
    enabled: true
    includePluginSources: true

dependencies:
  - ../modules/platform
  - ../modules/account
  - ../modules/article
  - ../modules/cart
  - ../modules/checkout
  - ../modules/email
  - ../modules/generator
  - ../modules/image
  - ../modules/magic-coins
  - ../modules/order
  - ../modules/payment
  - ../modules/country
  - ../modules/vat
  - ../modules/supplier
  - ../modules/pricing
  - ../modules/production
  - ../modules/promotion
  - ../modules/prompt
  - $libs.logback.classic: runtime-only
  - $libs.ktor.server.config.yaml
  - $libs.ktor.server.core
  - $libs.ktor.server.netty
  - $libs.ktor.server.request.validation
  - $libs.exposed.jdbc

test-dependencies:
  - ../modules/test-support
  - $libs.ktor.server.test.host
  # The composed application's t-shirt sync is driven against a MockEngine, so no test ever reaches
  # the real print-on-demand partner.
  - $libs.ktor.client.mock
  # An admin session is set directly instead of logged in: what a sign-in does is the account
  # module's contract, while every assertion of a composed admin journey starts from a signed-in one.
  - $libs.ktor.server.sessions

settings:
  jvm:
    mainClass: io.ktor.server.netty.EngineMain
  ktor:
    enabled: true
    applyBom: false

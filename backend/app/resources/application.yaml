# Base configuration with development defaults. Values that must stay out of
# source control (credentials, secrets, API keys) are blank here; the
# required-setting validation rejects them with a clear startup error until an
# override file supplies them.
#
# Overrides come from additional configuration files on the command line, where
# later files win and files merge per individual key:
#
#   java -jar app.jar -config=application.yaml -config=overrides.yaml
#
# The development launcher (scripts/start-dev-server.sh) layers
# backend/application-dev.yaml (shared, checked in) and then
# backend/application-local.yaml (per-developer secrets, ignored by Git) over
# this file; production passes its own file the same way.
# See docs/dev/getting-started/running-the-development-server.md.

ktor:
  deployment:
    port: 8080

  application:
    modules:
      - shop.voenix.ApplicationKt.module

database:
  host: localhost
  port: 5432
  database: voenix
  username: ""
  password: ""
  searchPath: voenix
  sslMode: Disable
  maximumPoolSize: 100

auth:
  sessionSecret: ""

frontend:
  # Where this deployment's frontend answers. Every mailed link is built from
  # it: the account links (confirmation, password reset, e-mail change) and the
  # permanent order link of the confirmation mail. Outside the local hosts it
  # must use HTTPS.
  baseUrl: http://localhost:5173

  # Directory with the built frontend (frontend/dist). Empty means the backend
  # serves no frontend — development uses the Vite dev server instead. The
  # full-stack image (repository-root Dockerfile) sets this to the directory it
  # copied the build into.
  distPath: ""

email:
  enabled: false
  pollIntervalMinutes: 5
  apiKey: ""
  fromEmail: ""
  fromName: Voenix Shop

production:
  artifactRoot: ./data/production/artifacts

  # The print-on-demand channel (SPOD). Both values are blank in a deployment
  # that has no such supplier; a deployment that has one must set both, and the
  # startup refuses otherwise. The secret is the last path segment of the
  # callback URL configured in SPOD's webhook subscriptions, so it has to be at
  # least 32 characters — see docs/dev/backend/packages/spod-fulfillment.md.
  spod:
    webhookSecret: ""
    alertEmail: ""

generator:
  dummyMode: false
  apiKey: ""

mollie:
  apiKey: ""
  redirectUrl: ""
  webhookUrl: ""
  webhookSecret: ""

rateLimit:
  trustForwardedFor: false

image:
  publicRoot: ./data/images/public
  privateRoot: ./data/images/private
  cacheRoot: ./data/images/cache

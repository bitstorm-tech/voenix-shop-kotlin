# Container overrides, layered over app/resources/application.yaml inside the
# application image (see ../Dockerfile and ../docker-compose.yml).
#
# This is the only configuration layer that reads environment variables. It has
# to: an image is built once and configured per deployment, and a container has
# no per-developer application-local.yaml. `$NAME` is Ktor's environment
# substitution; a variable that is not set makes startup fail with a clear
# message, which is what we want — no silent fallback to a development default.
#
# The base file app/resources/application.yaml deliberately stays free of `$`
# substitution (ApplicationYamlConfigTest pins that), so nothing here changes
# how the development launcher works.
# See docs/dev/backend/verification-stack.md.

database:
  host: $DATABASE_HOST
  port: $DATABASE_PORT
  database: $DATABASE_NAME
  username: $DATABASE_USERNAME
  password: $DATABASE_PASSWORD

auth:
  sessionSecret: $AUTH_SESSION_SECRET

email:
  enabled: $EMAIL_ENABLED

generator:
  dummyMode: $GENERATOR_DUMMY_MODE

mollie:
  apiKey: $MOLLIE_API_KEY
  redirectUrl: $MOLLIE_REDIRECT_URL
  webhookUrl: $MOLLIE_WEBHOOK_URL
  webhookSecret: $MOLLIE_WEBHOOK_SECRET
